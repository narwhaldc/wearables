#   Wearables registry collections (KV Store). Data lives in KV Store, NOT in the
#   app package -> survives app UPGRADES (unlike shipped lookups/*.csv, which the
#   package overwrites on every upgrade). Populated by admins at deployment.
#   Write is locked to admin/sc_admin via metadata (collections ACLs).

[wearable_person_profile]
field.person_id = string
field.person_name = string
field.step_goal = number
field.distance_goal_m = number
field.calorie_goal = number
field.height_cm = number
field.units = string
field.splunk_user = string
field.birth_ym = string
field.household_id = string

#   Family/household ACCESS + relationship edges (viewer -> subject person).
#   One row per (viewer_splunk_user, person_id): "this Splunk login may view this
#   person, and is related to them as <relationship>". Source of truth for
#   (a) generating each viewer's per-person RBAC roles and (b) the relationship
#   network diagram. Enrichment/labels only — the ACCESS GATE is still the
#   authorize.conf srchFilter on the indexed person_id (see RBAC.md).
#   household_id on wearable_person_profile is the (unambiguous) grouping key for
#   rollups/roster; relationship here is viewer-relative (Andrew is "child" to a
#   parent, "self" to himself).
[wearable_relationships]
field.viewer_splunk_user = string
field.person_id = string
field.relationship = string
field.can_view = string

[wearable_identity_map]
field.vendor = string
field.vendor_user_id = string
field.person_id = string

[wearable_device_profile]
field.device_id = string
field.device_name = string
field.vendor = string
field.person_id = string
