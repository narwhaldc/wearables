#   widx — the index the dashboards search (deployment knob: change this ONE line to
#   remap the whole app to a different index). Defined as index=wearables only —
#   deliberately NOT the oura+wearables union (that lives in the oura_health app),
#   because ~64% of index=oura is untagged legacy that doesn't belong in this
#   RBAC/model-clean app. Dashboard read-searches use `widx`; the dedup-maintenance
#   and registry-backup saved searches keep a literal index=wearables (they write/
#   delete on the specific index).
[widx]
definition = index=wearables
iseval = 0

#   dedup_workouts — cross-vendor workout SESSION dedup, SEARCH-TIME only (#34).
#   Raw events are never deleted; this collapses the same physical session logged
#   by more than one vendor (e.g. an Oura ring auto-detect + an Apple Watch
#   recording of the same run) into one row for display/counting.
#
#   Pipe canonical workout events into it:   `widx` tag=wearable_workout person_id="X" | `dedup_workouts`
#
#   Sessionization: same person + same canonical activity + overlapping time
#   interval (2-minute grace on the gap). Two records are the same session when
#   the next start is within 120s of the running previous end. Tune the 120 below
#   to widen/narrow the grace — this is the ONE place it lives.
#
#   Merge rule: vendor priority Apple > Garmin > Oura > Withings ("source of truth
#   if available" — Apple has the largest install base). Per-metric fallback: each
#   field takes the highest-priority vendor that actually HAS a value (first()
#   skips nulls), so calories can come from Apple while distance falls back to
#   Oura. session_vendors lists every contributing vendor for transparency.
[dedup_workouts]
definition = sort 0 person_id workout_activity_canon workout_start_epoch \
| streamstats current=f window=1 global=f last(workout_end_epoch) as _prev_end by person_id workout_activity_canon \
| eval _newsess=if(isnull(_prev_end) OR workout_start_epoch > _prev_end + 120, 1, 0) \
| streamstats sum(_newsess) as _sid by person_id workout_activity_canon \
| eval _vrank=case(vendor="apple",1,vendor="garmin",2,vendor="oura",3,vendor="withings",4,true(),5) \
| eval _sesskey=person_id."|".workout_activity_canon."|".tostring(_sid) \
| sort 0 _sesskey _vrank \
| stats first(workout_start_epoch) as workout_start_epoch first(workout_end_epoch) as workout_end_epoch first(workout_calories) as workout_calories first(workout_distance_m) as workout_distance_m first(workout_intensity) as workout_intensity first(workout_activity) as workout_activity first(workout_id) as workout_id first(day) as day first(person_name) as person_name first(vendor) as vendor values(vendor) as session_vendors dc(vendor) as session_vendor_count by _sesskey person_id workout_activity_canon workout_activity_group \
| fields - _sesskey
iseval = 0
