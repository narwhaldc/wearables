#   Wearables index dedup maintenance — mirrors the oura_health two-pass
#   tag-then-delete pattern, targeting index=wearables. Scheduled ONE HOUR
#   LATER than the oura_health dedup jobs (Pass 1 03:00 vs oura 02:00; Pass 2
#   03:15 vs oura 02:15) so both apps can coexist on one instance without the
#   two dedup passes overlapping.
#
#   Why needed: HEC does not deduplicate; the ingest script's client-side dedup
#   store prevents most re-sends, but a reset/backfill/replay can still create
#   duplicate events in the index. Pass 2's `| delete` requires the running
#   role to hold the `can_delete` capability.
#
#   Pass 1 window = rolling 60 days, NOT Pass 2 or Verify (2026-08-28): Pass 1's
#   `streamstats ... by _raw` keeps an in-memory tally per unique _raw ever
#   seen, which grows unbounded as the index ages — an All Time run started
#   hitting Splunk's 200MB per-search memory cap once the index got large
#   enough (confirmed: "Reached the maximum in-memory consumption limit for
#   search results (200 MB), results might be incomplete"). Splunk does NOT
#   fail the job when this happens — it silently returns incomplete results,
#   which is why this never showed up as a scheduler failure. This is a
#   backstop for recent replay/backfill duplicates, not the primary defense
#   (the fetchers' own client-side dedup is), so a rolling window is an
#   acceptable tradeoff for Pass 1 — a duplicate whose original is >60d older
#   than its copy would be missed, but that beats the job silently truncating
#   and cleaning up nothing. One-time historical backlog was cleared manually
#   by walking backward through 60-day chunks before this change landed.
#
#   CORRECTED (2026-08-28, later same day): Pass 2 is windowed to -60d too, NOT
#   All Time. It doesn't have Pass 1's memory-crash risk (lookup-match-and-
#   delete is constant memory per event), but on SmartStore an All Time search
#   still forces EVERY historical bucket back from remote object storage to
#   the indexers, evicting whatever else was cached and slowing down other use
#   of the cluster — a real ongoing nightly cost, not a one-time one. This
#   isn't a Cloud-only concern: SmartStore is standard on Splunk Cloud, but
#   most self-managed Enterprise (CMP) customers have migrated to it too,
#   pointed at their own S3/GCS/Azure bucket — anywhere SmartStore is in use,
#   this cost applies. The
#   All-Time justification (catching a stale _cd reference older than 60d)
#   turns out to be worth nothing in practice: Pass 1 (3:00) always runs
#   before Pass 2 (3:15) in the same nightly cycle, so by the time Pass 2 runs
#   the lookup has ALREADY been rewritten under the -60d window that same
#   night — it can never contain a _cd older than 60 days, so Pass 2 scanning
#   further back can never find an extra match. Zero benefit, real ongoing
#   SmartStore cost — so Pass 2 is windowed the same as Pass 1: -60d@d, not
#   plain -60d. The @d snap-to-midnight matters: Pass 1 runs at 3:00, Pass 2 at
#   3:15, so without it "now" has moved forward 15 minutes between them and
#   their window STARTS would differ by that same 15 minutes — a duplicate
#   Pass 1 tagged right at the oldest edge of its window could fall just
#   outside Pass 2's slightly-later-anchored one and never get deleted.
#   -60d@d sidesteps this exactly rather than approximately: both searches
#   run on the same calendar day, so "-60d@d" resolves to the identical
#   midnight boundary for both regardless of the 15-minute gap between them —
#   Pass 2's window becomes a strict superset of Pass 1's (same start, 15
#   minutes more at the end via latest=now), so every _cd Pass 1 could ever
#   tag is guaranteed to still be inside Pass 2's scan range.
#
#   Verify, Pass 1a, and Pass 2a stay at All Time — but they are NOT scheduled
#   (enableSched=0, manual/on-demand only), so paying the SmartStore cost is a
#   deliberate, occasional, human-triggered choice, not an automatic nightly
#   tax. Verify uses dc(_raw) (Splunk's approximate cardinality estimator,
#   bounded memory regardless of scale — confirmed clean at All Time: 418,127
#   total / 367,804 unique / 50,323 duplicate events); Pass 1a/Pass 2a operate
#   on their own separate lookup (wearables_dup_events_sweep.csv) for exactly
#   the "big historical cluster outside the nightly window" case — see the
#   comment above the Pass 1a stanza.

[Wearables Dedup — Pass 1: Tag Duplicates]
description = Identifies duplicate events in index=wearables (last 60 days, snapped to midnight \
    via -60d@d — see savedsearches.conf header for why) by _raw content and writes their _cd \
    values to wearables_dup_events.csv — first occurrence of each _raw is kept; every later copy \
    is listed. Pass 2 reads that lookup and deletes the matching events. (Do NOT append a \
    trailing stats/outputlookup here — it would overwrite the _cd list with a summary row and \
    Pass 2 would then find nothing to delete.)
search = index=wearables \
    | streamstats count as _rank by _raw \
    | where _rank > 1 \
    | eval event_cd=_cd \
    | table event_cd \
    | outputlookup wearables_dup_events.csv
dispatch.earliest_time = -60d@d
dispatch.latest_time = now
cron_schedule = 0 3 * * *
enableSched = 1
disabled = 0
alert.track = 0

#   Pass 1a is a MANUAL, unscheduled companion to Pass 1 — not part of the
#   nightly routine. Pass 1's 60-day window only catches recent duplicates;
#   Pass 1a instead walks ALL of history in month-sized chunks via `map`, so
#   each chunk's streamstats only holds one month's worth of _raw values in
#   memory (never the whole index at once), avoiding the exact memory cap
#   Pass 1 hit at All Time. It writes to its OWN lookup
#   (wearables_dup_events_sweep.csv), never wearables_dup_events.csv — sharing
#   that file with the nightly Pass 1/Pass 2 would mean the very next nightly
#   run silently overwrites whatever this sweep found before anyone could act
#   on it. It resets its own file at the start of every run (`where 1=0` before
#   the first outputlookup — Splunk on this instance rejects `head 0`), so
#   re-running it never accumulates duplicate _cd rows across separate runs.
#   Deliberately does NOT delete anything — that stays a manual, reviewed step:
#   Pass 2a (below) deletes exactly what this sweep tagged, once you're ready.
[Wearables Dedup — Pass 1a: Historical Sweep (All Time, Monthly Chunks)]
description = MANUAL, unscheduled companion to Pass 1 — see savedsearches.conf header comment \
    above this stanza for why it exists and how it differs. Walks all of history one month at a \
    time via map (bounded memory per chunk, safe at All Time), tagging duplicate _cd values into \
    wearables_dup_events_sweep.csv (its own file, separate from Pass 1/Pass 2's \
    wearables_dup_events.csv). Resets that file at the start of every run. Does NOT delete \
    anything — review the sweep's findings, then run Pass 2 against \
    wearables_dup_events_sweep.csv yourself when ready.
search = | makeresults \
    | where 1=0 \
    | outputlookup wearables_dup_events_sweep.csv \
    | append [ search index=wearables \
        | timechart span=1mon count as total_events dc(_raw) as unique_events \
        | eval dup_events=total_events-unique_events \
        | where dup_events>0 \
        | eval start=strftime(_time,"%m/%d/%Y:%H:%M:%S") \
        | eval end=strftime(relative_time(_time,"+1mon"),"%m/%d/%Y:%H:%M:%S") \
        | table start end \
        | map maxsearches=100 search="search index=wearables earliest=$start$ latest=$end$ | streamstats count as _rank by _raw | where _rank>1 | eval event_cd=_cd | table event_cd | outputlookup append=true wearables_dup_events_sweep.csv" ]
dispatch.earliest_time = 0
dispatch.latest_time = now
enableSched = 0
disabled = 0
alert.track = 0

#   Pass 2a mirrors Pass 2 exactly, just reading Pass 1a's sweep file instead
#   of Pass 1's nightly file — MANUAL and unscheduled, same as Pass 1a. Kept as
#   a separate stanza (not a shared lookup with Pass 2) so the nightly Pass 1
#   can never silently invalidate a sweep you haven't reviewed/deleted yet.
[Wearables Dedup — Pass 2a: Delete Duplicates (from Historical Sweep)]
description = Deletes events tagged by Pass 1a. Reads wearables_dup_events_sweep.csv (NOT \
    wearables_dup_events.csv — see savedsearches.conf header near Pass 1a for why they're kept \
    separate) and deletes matching events in index=wearables, All Time (a sweep-tagged duplicate \
    could be anywhere in history, so this must not be windowed the way Pass 1 is). Run only after \
    reviewing Pass 1a's results. Requires can_delete capability on the running role.
search = index=wearables \
    | eval event_cd=_cd \
    | lookup wearables_dup_events_sweep.csv event_cd OUTPUT event_cd AS dup_match \
    | where isnotnull(dup_match) \
    | delete
dispatch.earliest_time = 0
dispatch.latest_time = now
enableSched = 0
disabled = 0
alert.track = 0

[Wearables Dedup — Pass 2: Delete Duplicates]
description = Deletes events tagged by Pass 1. Reads wearables_dup_events.csv written by Pass 1 \
    and deletes matching events in index=wearables — windowed like Pass 1 (see savedsearches.conf \
    header for why this is NOT All Time despite having no memory-crash risk: an All Time search \
    here forces every historical bucket back from remote storage on SmartStore, nightly, for no \
    real benefit — not just a Cloud thing, see savedsearches.conf header). Uses -60d@d, NOT plain -60d — the @d snap-to-midnight makes this window's start \
    exactly match Pass 1's despite running 15 minutes later (3:15 vs 3:00), so a duplicate Pass 1 \
    tagged right at the oldest edge of its window can never fall outside Pass 2's and go \
    undeleted (see savedsearches.conf header for the full reasoning). If Pass 1 found no dups the \
    lookup is empty and nothing is deleted. If Pass 1 did not run, yesterday's stale _cd values \
    point to already-deleted events and match nothing. Requires can_delete capability on the \
    running role.
search = index=wearables \
    | eval event_cd=_cd \
    | lookup wearables_dup_events.csv event_cd OUTPUT event_cd AS dup_match \
    | where isnotnull(dup_match) \
    | delete
dispatch.earliest_time = -60d@d
dispatch.latest_time = now
cron_schedule = 15 3 * * *
enableSched = 1
disabled = 0
alert.track = 0

[Wearables Dedup — Verify: Check for Remaining Duplicates]
description = Quick health check — reports total events, unique events, duplicate count, and dup \
    percentage for index=wearables, All Time (uses dc(_raw), Splunk's approximate cardinality \
    estimator, which is safe at any scale — unlike Pass 1's streamstats/dedup approach). If \
    dup_events is 0, the index is clean. Run anytime from the saved searches list.
search = index=wearables \
    | stats count as total_events dc(_raw) as unique_events \
    | eval dup_events=total_events-unique_events \
    | eval dup_pct=round(dup_events/total_events*100, 1) \
    | table total_events unique_events dup_events dup_pct
dispatch.earliest_time = 0
dispatch.latest_time = now
enableSched = 0
disabled = 0
alert.track = 0

[Wearables Registry Backup — KV Store to index]
description = Nightly backup of the KV Store registries (person/device/identity) into \
    index=wearables so the data survives a full app removal. KV collections persist \
    across app UPGRADES automatically; this backup covers the REMOVAL/reinstall case. \
    Restore (admin): search the latest backup rows for a registry and pipe to \
    outputlookup, e.g. \
    index=wearables sourcetype=wearable_registry_backup reg=person_profile \
    | dedup person_id sortby -_time | fields - _* reg | outputlookup wearable_person_profile
search = | inputlookup wearable_person_profile | eval reg="person_profile" \
    | append [ | inputlookup wearable_device_profile | eval reg="device_profile" ] \
    | append [ | inputlookup wearable_identity_map | eval reg="identity_map" ] \
    | eval _time=now() \
    | collect index=wearables sourcetype=wearable_registry_backup
dispatch.earliest_time = -1m
dispatch.latest_time = now
cron_schedule = 45 3 * * *
enableSched = 1
disabled = 0
alert.track = 0

#   Data Quality Monitor — the recurring "watch for data types not named as we
#   expect + feeds gone silent" detector. Returns one row per finding:
#     - unmapped_activity_label : a workout_activity with no canonical mapping
#       (fix: add a row to wearable_activity_map.csv)
#     - stale_feed             : a (vendor, sourcetype) with no event in > 48h
#       (fix: check that vendor's ingest cron / token)
#   Fires (alert.track) only when there IS a finding, so a clean pipeline is quiet.
#   Pairs with the Admin > Ingest & Data Quality dashboard (live view of the same).
[Wearables Data Quality — Monitor]
description = Flags unmapped workout activity labels and feeds that have gone silent \
    (> 48h). One row per finding; fires only when something needs attention. See the \
    Admin > Ingest & Data Quality dashboard for the full live picture.
search = `widx` tag=wearable_workout \
    | lookup wearable_activity_map workout_activity OUTPUT workout_activity_canon \
    | where isnull(workout_activity_canon) \
    | stats count as detail_count values(vendor) as vendors by workout_activity \
    | eval finding="unmapped_activity_label", detail=workout_activity \
    | table finding detail detail_count vendors \
    | append \
        [ search `widx` earliest=-30d latest=now \
        | stats latest(_time) as last_epoch by vendor sourcetype \
        | eval age_h=round((now()-last_epoch)/3600,1) \
        | where age_h>48 \
        | eval finding="stale_feed", detail=vendor.":".sourcetype, detail_count=round(age_h/24,1), vendors=vendor \
        | table finding detail detail_count vendors ]
dispatch.earliest_time = -90d@d
dispatch.latest_time = now
cron_schedule = 30 3 * * *
enableSched = 1
disabled = 0
alert.track = 1
alert.severity = 3
alert.condition = search finding=*
