#   wearables props.conf — platform-level (not vendor ingest; that lives in the TAs).
#   Canonical workout-activity taxonomy: populate workout_activity_canon +
#   workout_activity_group on every workout event by an automatic, case-insensitive
#   lookup (wearable_activity_map, case_sensitive_match=false in transforms.conf)
#   keyed on the raw workout_activity. Applied per workout sourcetype across all
#   three vendors so the Workout data model exposes the canonical fields platform-
#   wide (exported system in metadata/default.meta). The raw workout_activity is
#   preserved. Unmapped labels leave canon null → surfaced on Admin > Ingest & Data
#   Quality + the DQ Monitor saved search (add a row to wearable_activity_map.csv).

[apple:workout]
LOOKUP-wearable_activity = wearable_activity_map workout_activity OUTPUT workout_activity_canon workout_activity_group

[oura:workouts]
LOOKUP-wearable_activity = wearable_activity_map workout_activity OUTPUT workout_activity_canon workout_activity_group

[garmin:activities]
LOOKUP-wearable_activity = wearable_activity_map workout_activity OUTPUT workout_activity_canon workout_activity_group

[withings:workouts]
LOOKUP-wearable_activity = wearable_activity_map workout_activity OUTPUT workout_activity_canon workout_activity_group

[google:exercise]
LOOKUP-wearable_activity = wearable_activity_map workout_activity OUTPUT workout_activity_canon workout_activity_group
