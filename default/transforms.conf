#   Shared cross-vendor person/device lookups (platform-level). Enrichment/identity
#   only — NOT the access gate (authorize.conf srchFilter on indexed person_id
#   enforces isolation). Backed by KV Store collections (see collections.conf) so
#   admin edits survive app upgrades. Write-locked to admin/sc_admin (see metadata).

[wearable_person_profile]
external_type = kvstore
collection = wearable_person_profile
fields_list = _key, person_id, person_name, step_goal, distance_goal_m, calorie_goal, height_cm, units, splunk_user, birth_ym, household_id
case_sensitive_match = true

[wearable_relationships]
external_type = kvstore
collection = wearable_relationships
fields_list = _key, viewer_splunk_user, person_id, relationship, can_view
case_sensitive_match = true

[wearable_identity_map]
external_type = kvstore
collection = wearable_identity_map
fields_list = _key, vendor, vendor_user_id, person_id
case_sensitive_match = true

[wearable_device_profile]
external_type = kvstore
collection = wearable_device_profile
fields_list = _key, device_id, device_name, vendor, person_id
case_sensitive_match = true

#   Canonical workout-activity taxonomy (CSV, admin-editable). Maps each vendor's
#   native label (Oura "cycling", Apple "Outdoor Cycling", Garmin "trail_running", …)
#   to a normalized workout_activity_canon + coarse workout_activity_group. Matching
#   is CASE-INSENSITIVE so "Cycling"/"cycling"/"CYCLING" collapse to one row — that
#   alone fixes the Yoga/yoga, Cycling/cycling splits. The raw workout_activity is
#   always preserved; the Workout data model exposes _canon/_group via a Lookup
#   calculation. Unmapped labels return null canon → surfaced on the Data Quality
#   admin page + the DQ Monitor saved search (add a row here to map them).
[wearable_activity_map]
filename = wearable_activity_map.csv
case_sensitive_match = false
